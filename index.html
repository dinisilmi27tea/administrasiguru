/* =========================================================
   SYSTEM VARIABLES & BLUEPRINT KHAKI THEME
========================================================= */
:root {
  --bg-cream: #F1E8D6;
  --bg-card: #FAF6EE;
  --bg-card-sub: #EFE6D2;
  --grid-line: rgba(23, 42, 70, 0.08);
  --navy: #172A46;
  --navy-light: #24405F;
  --border-blueprint: #172A46;
  --border-line: rgba(23, 42, 70, 0.25);
  
  --toska: #0FA98C;
  --orange: #EE8C3E;
  --purple: #8D78C9;
  --ink: #1C2431;
  --ink-soft: #4A5568;
  
  --font-head: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --shadow: 4px 4px 0px rgba(23, 42, 70, 0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background-color: var(--bg-cream);
  /* Latar belakang Khaki dengan pola Technical Grid */
  background-image: 
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 20px 20px;
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 60px;
}

h1, h2, h3, h4, .font-display {
  font-family: var(--font-head);
  letter-spacing: -0.02em;
}

/* ---------- TOP BAR (HEADER BLUEPRINT) ---------- */
.topbar {
  display: flex; 
  align-items: center; 
  justify-content: space-between;
  padding: 16px 32px; 
  background: var(--navy); 
  color: #fff;
  position: sticky; 
  top: 0; 
  z-index: 50;
  border-bottom: 3px solid var(--orange);
}
.topbar .brand { display: flex; align-items: center; gap: 14px; }
.brand .logo-mark {
  width: 42px; height: 42px;
  background: var(--orange);
  border: 1px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-weight: 800; font-size: 16px; color: #fff;
}
.brand-text .school { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.8; font-family: var(--font-head); }
.brand-text .title { font-family: var(--font-head); font-weight: 700; font-size: 16px; }
.topbar .who { text-align: right; font-size: 12px; opacity: 0.9; line-height: 1.4; font-family: var(--font-body); }
.topbar .who b { display: block; font-size: 13px; font-family: var(--font-head); color: var(--orange); }

/* ---------- BREADCRUMB ---------- */
.crumbbar {
  max-width: 1180px; margin: 22px auto 0; padding: 0 24px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.crumb {
  font-size: 12px; padding: 6px 14px;
  background: var(--bg-card); border: 1px solid var(--border-line); cursor: pointer;
  color: var(--ink); font-weight: 600; font-family: var(--font-head);
  text-transform: uppercase; letter-spacing: 0.05em;
  transition: .15s;
}
.crumb:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
.crumb.active { background: var(--orange); color: #fff; border-color: var(--orange); cursor: default; }
.crumb-sep { color: var(--ink-soft); opacity: 0.5; display: flex; align-items: center; }

/* ---------- CONTAINER ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding: 26px 24px 0; }
.screen-head { margin-bottom: 26px; }
.eyebrow {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy); font-weight: 700; margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px; font-family: var(--font-head);
}
.eyebrow .dot { width: 8px; height: 8px; background: var(--orange); display: inline-block; }
.screen-title { font-size: 28px; font-weight: 800; color: var(--navy); text-transform: uppercase; }
.screen-sub { color: var(--ink-soft); font-size: 14px; margin-top: 4px; max-width: 640px; }

/* ---------- BUTTONS ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-head); font-weight: 700; font-size: 13px;
  padding: 10px 18px; border: 1.5px solid var(--border-blueprint);
  background: var(--bg-card); color: var(--navy); cursor: pointer; transition: .15s;
  text-transform: uppercase; letter-spacing: 0.03em;
  box-shadow: 2px 2px 0px var(--border-blueprint);
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px var(--border-blueprint); }
.btn-back { background: var(--bg-card-sub); color: var(--ink); }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-light); }
.btn-print { background: var(--orange); color: #fff; border-color: var(--navy); }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }

/* ---------- BLUEPRINT CARDS & GRID ---------- */
.grid { display: grid; gap: 20px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media(max-width:900px){ .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; } }
@media(max-width:600px){ .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

/* Kartu Utama Beraksen Technical Blueprint */
.card {
  background: var(--bg-card); 
  border: 1.5px solid var(--border-blueprint); 
  padding: 22px; 
  cursor: pointer; 
  transition: .18s; 
  position: relative;
  box-shadow: var(--shadow);
}
/* Tanda Salib (+) di Sudut Kartu */
.card::before, .card::after {
  content: "+"; position: absolute; font-family: var(--font-head);
  font-size: 12px; color: var(--navy); font-weight: bold; line-height: 1; opacity: 0.6;
}
.card::before { top: 3px; left: 4px; }
.card::after { bottom: 3px; right: 4px; }

.card:hover { 
  transform: translate(-2px, -2px); 
  box-shadow: 6px 6px 0px var(--border-blueprint); 
  background: #fff;
}
.card .icn {
  width: 44px; height: 44px; border: 1px solid var(--border-blueprint); display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px; background: var(--bg-card-sub);
}
.card h3 { font-size: 16px; color: var(--navy); margin-bottom: 6px; }
.card p { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
.card .arrow { position: absolute; right: 18px; top: 22px; opacity: .4; transition: .15s; }
.card:hover .arrow { opacity: 1; transform: translateX(3px); color: var(--orange); }

.tone-toska .icn { background: rgba(15,169,140,0.15); color: var(--toska); border-color: var(--toska); }
.tone-orange .icn { background: rgba(238,140,62,0.15); color: var(--orange); border-color: var(--orange); }
.tone-navy .icn { background: rgba(23,42,70,0.1); color: var(--navy); }
.tone-purple .icn { background: rgba(141,120,201,0.15); color: var(--purple); border-color: var(--purple); }

.card.big { padding: 28px; }
.card.big .icn { width: 52px; height: 52px; }
.card.big h3 { font-size: 18px; }

/* Step Badge khas RPP */
.step-badge {
  font-family: var(--font-head); font-weight: 800; font-size: 12px; color: #fff;
  width: 28px; height: 28px; background: var(--navy); border: 1px solid var(--navy);
  display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
}

/* ---------- DOCUMENT CARD ---------- */
.doccard {
  background: var(--bg-card); border: 1.5px solid var(--border-blueprint); padding: 20px;
  display: flex; flex-direction: column; gap: 12px; position: relative;
  box-shadow: var(--shadow);
}
.doccard .row { display: flex; align-items: flex-start; gap: 12px; }
.doccard .icn { width: 40px; height: 40px; border: 1px solid var(--border-line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--bg-card-sub); }
.doccard h4 { font-size: 15px; color: var(--navy); margin-bottom: 4px; }
.doccard span.desc { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.drivebtn {
  margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; font-size: 12px; font-weight: 700; text-decoration: none;
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: 0.04em;
  background: var(--bg-card-sub); color: var(--navy); border: 1px solid var(--border-blueprint);
  cursor: pointer; transition: .15s;
}
.drivebtn:hover { background: var(--toska); color: #fff; border-color: var(--toska); }
.drivebtn.empty { background: transparent; color: var(--ink-soft); border-color: var(--border-line); cursor: default; opacity: 0.6; }

/* ---------- DASHBOARD HERO & STATS ---------- */
.dash-hero {
  background: var(--navy);
  border: 2px solid var(--navy);
  padding: 30px; color: #fff; position: relative; overflow: hidden; margin-bottom: 26px;
  box-shadow: var(--shadow);
}
/* Aksen Garis Pengukur / Blueprint Grid pada Hero */
.dash-hero::before {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 15px 15px; pointer-events: none;
}
.dash-hero h1 { font-size: 26px; font-weight: 800; color: #fff; text-transform: uppercase; }
.dash-hero p { opacity: 0.85; font-size: 13.5px; margin-top: 8px; max-width: 600px; line-height: 1.6; }
.hero-tags { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.hero-tags span {
  font-size: 11px; padding: 4px 10px; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.25); font-family: var(--font-head); font-weight: 600; letter-spacing: 0.05em;
}

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 26px; }
@media(max-width:900px){ .stat-row { grid-template-columns: 1fr 1fr; } }
.stat {
  background: var(--bg-card); border: 1.5px solid var(--border-blueprint); padding: 18px;
  display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow);
}
.ring { position: relative; width: 60px; height: 60px; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); }
.ring .bgc { fill: none; stroke: var(--bg-card-sub); stroke-width: 8; }
.ring .fgc { fill: none; stroke-width: 8; stroke-linecap: square; }
.ring .val {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-weight: 800; font-size: 12px; color: var(--navy);
}
.stat .lbl { font-size: 12px; color: var(--navy); font-weight: 700; font-family: var(--font-head); }
.stat .sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

.section-label {
  font-family: var(--font-head); font-weight: 800; font-size: 14px; color: var(--navy);
  margin: 30px 0 14px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.05em;
}
.section-label .bar { width: 10px; height: 10px; background: var(--orange); display: inline-block; }

/* ---------- PROGRAM LAUNCH CARDS ---------- */
.program-launch { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 8px; }
@media(max-width:800px){ .program-launch { grid-template-columns: 1fr; } }
.launch-card {
  border: 1.5px solid var(--border-blueprint); padding: 26px; position: relative; cursor: pointer;
  color: #fff; transition: .2s; min-height: 190px; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: var(--shadow);
}
.launch-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--border-blueprint); }
.launch-card.ipas { background: var(--navy); }
.launch-card.pbp { background: var(--navy-light); }
.launch-card h2 { font-size: 20px; margin-bottom: 6px; color: #fff; text-transform: uppercase; }
.launch-card p { font-size: 13px; opacity: 0.85; max-width: 360px; line-height: 1.5; }
.launch-card .tag {
  align-self: flex-start; font-size: 10px; padding: 4px 10px;
  background: var(--orange); color: #fff; margin-bottom: 14px; font-weight: 700; letter-spacing: 0.08em;
  font-family: var(--font-head);
}
.launch-card .go {
  position: absolute; right: 22px; bottom: 22px; width: 36px; height: 36px; border: 1px solid #fff;
  background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;
}

/* ---------- PROGRESS BARS (TECHNICAL METRICS) ---------- */
.bars { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
.barrow { display: flex; align-items: center; gap: 14px; }
.barrow .lab { width: 100px; font-size: 12px; font-weight: 700; color: var(--navy); flex-shrink: 0; font-family: var(--font-head); }
.barrow .track { flex: 1; height: 12px; border: 1px solid var(--border-blueprint); background: var(--bg-card-sub); overflow: hidden; position: relative; }
.barrow .fill { height: 100%; }
.barrow .num { width: 60px; text-align: right; font-size: 12px; font-weight: 700; color: var(--navy); flex-shrink: 0; font-family: var(--font-head); }

/* ---------- FOOTER ACTIONS ---------- */
.footer-actions { display: flex; justify-content: space-between; margin-top: 34px; }

/* ---------- PRINT STYLES ---------- */
@media print {
  .topbar, .crumbbar, .btn-back, .btn-print, .footer-actions, .dash-hero, .stat-row, .program-launch, .section-label { display: none !important; }
  body { background: #fff; background-image: none; }
  .wrap { padding: 0; }
  .print-only { display: block !important; }
  .card, .doccard { box-shadow: none; border-color: #000; }
}
.print-only { display: none; }

.i { width: 20px; height: 20px; }
</style>
</head>

========================================================= */
let state = { screen:"home", program:null, tahun:null, sub:null, tahap:null };

function go(next){ state = {...state, ...next}; render(); window.scrollTo({top:0,behavior:"smooth"}); }

function crumbs(){
  const c = [{label:'Beranda', onClick:()=>go({screen:'home',program:null,tahun:null,sub:null,tahap:null})}];
  if(state.program==='ipas'){
    c.push({label:'Projek IPAS', onClick:()=>go({screen:'tahun',tahun:null,sub:null,tahap:null})});
    if(state.tahun) c.push({label:state.tahun, onClick:()=>go({screen:'sub',sub:null,tahap:null})});
    if(state.sub) c.push({label:state.sub, onClick:()=>go({screen:'tahap',tahap:null})});
    if(state.tahap) c.push({label:state.tahap, onClick:()=>go({screen:'docs'})});
  } else if(state.program==='pbp'){
    c.push({label:'PBP Kompos', onClick:()=>go({screen:'tahun',tahun:null,sub:null,tahap:null})});
    if(state.tahun) c.push({label:state.tahun, onClick:()=>go({screen:'sub',sub:null,tahap:null})});
    if(state.sub) c.push({label: siklusName(state.sub), onClick:()=>go({screen:'tahap',tahap:null})});
    if(state.tahap) c.push({label:state.tahap, onClick:()=>go({screen:'docs'})});
  }
  return c;
}
function siklusName(id){
  const list = SIKLUS_LIST[state.tahun]||[];
  const f = list.find(s=>s.id===id);
  return f? f.nama : id;
}
function yearCode(tahun){
  const [a,b] = tahun.split('/');
  return a.slice(2) + b.slice(2);
}

function renderCrumbs(){
  const list = crumbs();
  document.getElementById("crumbbar").innerHTML = list.map((c,i)=>{
    const isLast = i===list.length-1;
    return `<span class="crumb ${isLast?'active':''}" ${isLast?'':`onclick="(${c.onClick.toString()})()"`}>${c.label}</span>` +
      (isLast? "" : `<span class="crumb-sep">${ICONS.arrow}</span>`);
  }).join("");
}

/* Helper Ring Gauge */
function ring(pct, color, label, sub){
  const r=24, c=2*Math.PI*r;
  const dash = Math.min(pct,100)/100*c;
  return `<div class="stat">
    <div class="ring"><svg width="60" height="60">
      <circle class="bgc" cx="30" cy="30" r="${r}"/>
      <circle class="fgc" cx="30" cy="30" r="${r}" stroke="${color}" stroke-dasharray="${dash} ${c}"/>
    </svg><div class="val">${pct}%</div></div>
    <div><div class="lbl">${label}</div><div class="sub">${sub}</div></div>
  </div>`;
}

function barRow(label, val, max, color){
  const pct = Math.min(100, Math.round(val/max*100));
  return `<div class="barrow">
    <div class="lab">${label}</div>
    <div class="track"><div class="fill" style="width:${pct}%; background:${color};"></div></div>
    <div class="num">${val} JP</div>
  </div>`;
}

function backRow(onClickBack){
  return `<div class="footer-actions">
    <button class="btn btn-back" onclick="(${onClickBack.toString()})()">${ICONS.back} Kembali</button>
  </div>`;
}

function render(){
  renderCrumbs();
  const app = document.getElementById("app");
  switch(state.screen){
    case "home": app.innerHTML = screenHome(); break;
    case "tahun": app.innerHTML = screenTahun(); break;
    case "sub": app.innerHTML = screenSub(); break;
    case "tahap": app.innerHTML = screenTahap(); break;
    case "docs": app.innerHTML = screenDocs(); break;
    default: app.innerHTML = screenHome();
  }
}
